<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; margin-top: 50px; }
    .calc { width: 220px; }
    #display { width: 100%; height: 40px; font-size: 20px; text-align: right; margin-bottom: 8px; box-sizing: border-box; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button { height: 45px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="calc">
    <input id="display" disabled>
    <div class="keys">
      <button>7</button><button>8</button><button>9</button><button>/</button>
      <button>4</button><button>5</button><button>6</button><button>*</button>
      <button>1</button><button>2</button><button>3</button><button>-</button>
      <button>0</button><button>.</button><button>C</button><button>+</button>
      <button style="grid-column: span 4">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
